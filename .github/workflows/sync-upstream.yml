# Keeps this fork's `main` identical to devicelab-dev/maestro-runner `main` (see VYRA.md).
# Our patches live on `vyra`, the default branch, which is where this schedule runs from.
# A push made with the job token starts no other workflow, so upstream's CI does not run here.
name: sync-upstream

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bring main up to date with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main \
            --jq '"main: \(.merge_type) (\(.message))"'
